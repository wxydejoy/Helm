[project]
name = "helm-mini"
version = "0.1.0"
description = "Mac Mini 本机 CPU / 内存 / GPU 采样，给岸亭主屏第二行用。"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psutil>=6.0",
]

[project.scripts]
helm-mini = "helm_mini.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helm_mini"]
